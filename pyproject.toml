[project]
name = "llama3_2_1b_scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "N-Harish", email = "harishnatarajan24@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.30.0",
    "torch==2.5.1",
    "transformers>=5.16.1",
    "safetensors>=0.5.0",
    "tiktoken>=0.14.0",
    "tabulate>=0.10.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
